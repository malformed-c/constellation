name: Go Checks

on:
  pull_request: {}
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.after }}
  cancel-in-progress: true

jobs:
  go-mod:
    name: Check Go Modules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check module vendoring
        run: |
          go mod tidy
          go mod vendor
          test -z "$(git status --porcelain)" || \
            (echo "please run 'go mod tidy && go mod vendor' and commit the result"; exit 1)

  golangci:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          skip-cache: true
          args: "--verbose --modules-download-mode=vendor"

  # Unit tests run on BOTH architectures. The images are already built
  # linux/amd64,linux/arm64 (build-images.yaml), so arm64 binaries ship
  # whether or not anything exercises them; this is what actually tests
  # them. Only this job is matrixed: go-mod is vendoring (arch-independent)
  # and golangci-lint's rules are too - the arm64 typecheck that would
  # matter is already covered here, because `go test` compiles every
  # package and its tests for the target arch.
  go-test:
    name: Unit Tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Don't let one arch failing cancel the other - when they diverge,
      # seeing BOTH results is the whole point.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test -v -count=1 -timeout=5m ./pkg/... ./daemon/...
