name: BPF Checks

on:
  pull_request: {}
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.after }}
  cancel-in-progress: true

jobs:
  check_changes:
    name: Check for BPF changes
    runs-on: ubuntu-24.04
    outputs:
      bpf-tree: ${{ steps.changes.outputs.bpf-tree }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check code changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            bpf-tree:
              - 'bpf/**'
              - 'Makefile*'
              - '!**/*.md'

  # Run on both architectures: the BPF build pulls in host headers and
  # arch-dependent toolchain behaviour, so it is the check most likely to
  # differ between amd64 and arm64 - which matters here because the agent
  # image ships arm64 while the chart currently excludes arm64 nodes via
  # nodeSelector (kubernetes.io/arch: amd64).
  #
  # NOTE: this step ends in `|| true`, so it reports problems without ever
  # failing the job - on either arch. That predates this change and is left
  # as-is deliberately: dropping it is a separate call, because nobody has
  # established that `make -C bpf check` is currently clean, and making it
  # blocking in the same change that adds a new arch would conflate "arm64
  # is broken" with "this check was never enforced".
  bpf-lint:
    name: BPF Lint (${{ matrix.arch }})
    needs: check_changes
    if: ${{ needs.check_changes.outputs.bpf-tree == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run BPF checks
        run: |
          make -C bpf check || true
