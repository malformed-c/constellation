# Raised above the chart default of 0.0025: this node runs a much larger pod
# count than its 7.7 GiB warrants, so the CT/NAT tables need headroom. 0.025
# budgets ~198 MiB and costs ~350 MiB of real memlock (~4.5% of the box).
#
# It was 0.15 until 2026-08-04, which claimed ~2.1 GiB - 27% of the machine,
# permanently - and evicted pods for two days. Do not raise it without
# measuring actual memlock afterwards; the ratio is not a memory cap.
bpfMapDynamicSizeRatio: 0.025

# InventX overlay for the Constellation chart — ported from the inventx Terraform
# (plans/cilium-ix-values.yaml.tmpl, upstream Cilium chart). Maps each inventx
# Cilium setting to a verified cilium-agent flag (checked against the v1.20 agent
# binary). The base chart already sets routing-mode=tunnel, kube-proxy-replacement,
# ipam=cluster-pool, enable-ipv6=false, enable-bpf-masquerade, bpf-lb-sock-hostns-only.
#
#   helm install constellation oci://ghcr.io/malformed-c/charts/constellation \
#     -f examples/inventx-values.yaml --set k8sServiceHost=<api_server_ip>
#
# NOT ported: Hubble relay + UI (this minimal chart has no Hubble templates — they
# need their own Deployments/Services/certs). envoy was disabled in inventx too,
# which matches the base. externalIPs is implied by kube-proxy-replacement in v1.20
# (no --enable-external-ips flag), so it needs no override.

# inventx is a stock single-datapath cluster (not the sharded Constellation fork),
# so disable the managed-pawns shard selector and select by the inventx node label.
managedPawnsSelector: ""
nodeSelector:
  cni: "cilium"

clusterName: inventx
clusterID: 1
mtu: 1360

# inventx pod CIDR pool.
clusterPool:
  cidr: 10.42.0.0/16
  maskSize: 24

agent:
  extraArgs:
    # encryption (WireGuard) — nodes interact over the public internet.
    - --enable-wireguard=true
    - --encrypt-node=true
    # overlay + native-routing CIDR.
    - --tunnel-protocol=vxlan
    - --ipv4-native-routing-cidr=10.42.0.0/16
    # datapath: netkit, no host legacy routing.
    - --datapath-mode=netkit
    - --enable-host-legacy-routing=false
    # distributed LRU + clock probe. The map size ratio is NOT set here - it
    # is bpfMapDynamicSizeRatio at the top of this file. A literal in
    # extraArgs renders after the base args and silently wins over the chart
    # value, which is how the old 0.15 survived unnoticed.
    - --bpf-distributed-lru=true
    - --enable-bpf-clock-probe=true
    # bandwidth manager + BBR (host-ns only).
    - --enable-bandwidth-manager=true
    - --enable-bbr=true
    - --enable-bbr-hostns-only=true
    # path MTU discovery + L2 announcements.
    - --enable-pmtu-discovery=true
    - --enable-l2-announcements=true
    # devices: the external WireGuard interface.
    - --devices=wg-external
    - --force-device-detection=true

# inventx schedules the operator on the control-plane node.
operator:
  # Pin the kubeconfig paths explicitly rather than inheriting them. inventx is
  # NOT k3s and NOT kubeadm: it runs the self-hosted perigeos control plane, and
  # its kubeconfig lives here. Taken from the deployment that actually works,
  # not guessed.
  #
  # This is pinned because inheriting it has already caused an outage: the chart
  # once defaulted to /etc/rancher/k3s, the volume is declared type=Directory
  # (which Kubernetes requires to exist), and the operator could not start. The
  # version pin did not protect against it either -- the OCI chart tag was
  # re-published with a different default underneath the same version.
  kubeconfigDir: /etc/kubernetes/constellation
  kubeconfigPath: /etc/kubernetes/constellation/kubeconfig
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoSchedule
