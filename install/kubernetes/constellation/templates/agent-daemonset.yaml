apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: constellation-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: constellation-agent
    {{- include "constellation.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: constellation-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: constellation-agent
        {{- include "constellation.labels" . | nindent 8 }}
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: constellation-agent
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.agent.tolerations | nindent 8 }}
      priorityClassName: system-node-critical
      initContainers:
        # Disable reverse-path filtering: Arch ships rp_filter=2, which makes the
        # kernel drop BPF-redirected packets (they arrive on an unexpected path).
        # Effective rp_filter is max(all, interface), so zero both default + wildcard.
        - name: fix-sysctls
          image: "{{ include "constellation.agentImage" . }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              # Persist for subsequent boots.
              printf '%s\n' \
                'net.ipv4.conf.default.rp_filter = 0' \
                'net.ipv4.conf.all.rp_filter = 0' \
                'net.ipv4.conf.*.rp_filter = 0' \
                > /host-etc/sysctl.d/99-constellation-rp-filter.conf
              # Apply NOW, explicitly. Do NOT use `sysctl --system`: it reads
              # THIS CONTAINER's /etc and /usr/lib/sysctl.d, not the host's -
              # the host's /etc is mounted at /host-etc, so the file written
              # above is not even on the path it would read. Meanwhile the
              # agent image ships /usr/lib/sysctl.d/55-network-security.conf
              # with rp_filter=2, and this pod is hostNetwork + privileged, so
              # `sysctl --system` applied the *container's* hardening defaults
              # to the *host* - setting rp_filter to 2, the exact opposite of
              # this container's purpose.
              sysctl -w net.ipv4.conf.default.rp_filter=0
              sysctl -w net.ipv4.conf.all.rp_filter=0
              # A veth keeps the value it was born with, and cilium only writes
              # rp_filter=0 on devices it CREATES. So any lxc* device that
              # already existed when this agent started - e.g. pods adopted
              # across a cold boot - keeps the old default of 2 and silently
              # drops all pod egress in the kernel's reverse-path check: after
              # the veth tap, before conntrack, with no cilium drop event. Sweep
              # them, otherwise the fix only covers pods created from now on and
              # the existing cohort stays dead until something recreates it.
              for f in /proc/sys/net/ipv4/conf/lxc*/rp_filter; do
                [ -e "$f" ] || continue
                if [ "$(cat "$f")" != 0 ]; then
                  echo 0 > "$f"
                  echo "reset rp_filter=0 on ${f}"
                fi
              done
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
        # Install the cilium-cni binary onto the host (perigeos writes the CNI
        # conflist itself under /etc/cni/net.d/constellation).
        - name: install-cni
          image: "{{ include "constellation.agentImage" . }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command:
            - sh
            - -c
            - "cp /opt/cni/bin/cilium-cni /host-cni-bin/.cilium-cni.tmp && mv /host-cni-bin/.cilium-cni.tmp /host-cni-bin/cilium-cni"
          volumeMounts:
            - name: cni-path
              mountPath: /host-cni-bin
      containers:
        - name: agent
          image: "{{ include "constellation.agentImage" . }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command: ["/usr/bin/cilium-agent"]
          args:
            - --routing-mode=tunnel
            - --kube-proxy-replacement=true
            - --ipam=cluster-pool
            - --enable-ipv6=false
            - --enable-bpf-masquerade=true
            - --bpf-lb-sock-hostns-only=true
            - --bpf-map-dynamic-size-ratio={{ .Values.bpfMapDynamicSizeRatio }}
            {{- if .Values.managedPawnsSelector }}
            - --managed-pawns-selector={{ .Values.managedPawnsSelector }}
            {{- end }}
            {{- /*
              Each entry is one TIER, tried in order. A nested list is a tier
              whose members are equally preferred - joined with spaces here
              because the agent splits a flag value on whitespace to recover
              the tier (a comma cannot be used: pflag already splits on it).
              A bare string is just a one-member tier, so flat lists keep
              working unchanged.
            */}}
            {{- range .Values.k8sAPIServerURLs }}
            {{- if kindIs "slice" . }}
            - --k8s-api-server-urls={{ join " " . }}
            {{- else }}
            - --k8s-api-server-urls={{ . }}
            {{- end }}
            {{- end }}
            {{- if gt (int .Values.mtu) 0 }}
            - --mtu={{ .Values.mtu }}
            {{- end }}
            {{- if .Values.tunnelEndpointOverrides }}
            - --tunnel-endpoint-overrides={{ .Values.tunnelEndpointOverrides }}
            {{- end }}
            {{- if .Values.enableScaleToZeroDatapath }}
            - --enable-scale-to-zero-datapath=true
            {{- end }}
            {{- if .Values.clusterName }}
            - --cluster-name={{ .Values.clusterName }}
            - --cluster-id={{ .Values.clusterID }}
            {{- end }}
            {{- with .Values.agent.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: {{ include "constellation.k8sServiceHost" . | quote }}
            - name: KUBERNETES_SERVICE_PORT
              value: {{ .Values.k8sServicePort | quote }}
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          securityContext:
            privileged: true
          livenessProbe:
            httpGet:
              path: /healthz
              host: 127.0.0.1
              port: 9879
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /healthz
              host: 127.0.0.1
              port: 9879
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: host-proc
              mountPath: /proc
            - name: host-sys
              mountPath: /sys
            - name: host-dev
              mountPath: /dev
            - name: cilium-run
              mountPath: /var/run/cilium
            - name: cni-path
              mountPath: /opt/cni/bin
            - name: cni-conf-dir
              mountPath: /etc/cni/net.d/constellation
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: xtables-lock
              mountPath: /run/xtables.lock
            - name: host-netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: cilium-run
          hostPath:
            path: /var/run/cilium
            type: DirectoryOrCreate
        - name: cni-path
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-conf-dir
          hostPath:
            path: /etc/cni/net.d/constellation
            type: DirectoryOrCreate
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-dev
          hostPath:
            path: /dev
        - name: host-netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
