# Constellation Helm values. This chart is a clean, minimal templating of the
# known-good bare-metal/perigeos deployment (agent DaemonSet + operator
# Deployment + RBAC + ServiceAccounts), NOT the upstream Cilium chart — it
# deliberately omits the cloud-provider machinery (per-cloud operator variants,
# AWS-ENI hooks, clustermesh certs, Hubble relay/UI, Envoy, cgroup/bpf
# auto-mount + sysctlfix init containers) that does not apply here and does not
# run under perigeos's nspawn pod execution. The agent's only init containers
# are the one-shot rp_filter fix and the cilium-cni binary install.
#
# Datapath features beyond the always-on base (WireGuard encryption, netkit,
# BBR, PMTU discovery, L2 announcements, ...) are added via agent.extraArgs /
# operator.extraArgs — see examples/inventx-values.yaml for a full overlay.

namespace: kube-system

# The API server the agent (kube-proxy replacement) and operator reach. REQUIRED.
#   --set k8sServiceHost=10.0.0.1
k8sServiceHost: ""
k8sServicePort: "6443"

# Optional list of additional API server URLs (scheme://host:port) for
# clusters where the control plane binds several interfaces (e.g. a
# control-plane-colocated node reachable on 127.0.0.1 as well as a shared
# LAN address reachable from every node). Wires into Cilium's own built-in
# --k8s-api-server-urls, and keeps re-checking /readyz at runtime - so this
# needs no per-node detection logic of its own, unlike k8sServiceHost above
# which is a single value used as the KUBERNETES_SERVICE_HOST fallback.
#
# ORDER MATTERS in this fork, and the list is TIERED. Each entry is one tier,
# tried in order: the agent starts on tier 1 and falls back down the list on
# connection failure. (Upstream Cilium picks at random; that spreads load
# across distinct API servers, but here the entries are usually several
# network paths to the SAME control plane, so there is no load to spread and
# random selection just means an arbitrary path per agent start.)
#
# A tier may be a NESTED LIST whose members are equally preferred - the agent
# shuffles within a tier per-process, so N agents starting together spread
# across genuinely equivalent API servers while still honouring the tier
# order. That gives both properties at once:
#
#   k8sAPIServerURLs:
#     - https://127.0.0.1:6443                                    # tier 1: local
#     - [https://10.0.0.1:6443, https://10.0.0.2:6443]            # tier 2: HA pair, spread
#     - https://10.0.0.9:6443                                     # tier 3: last resort
#
# A bare string is just a one-member tier, so a flat list behaves exactly as
# a strict preference order. Put the cheapest/most reliable path first - e.g.
# a wired LAN address ahead of a wireless one. An entry that is wrong for a
# given host (loopback on a node that is not the control plane) fails fast
# and rotates on, so one cluster-wide list can still suit hosts whose best
# path differs.
#   --set k8sAPIServerURLs[0]=https://10.0.0.1:6443 --set k8sAPIServerURLs[1]=https://10.0.0.9:6443
k8sAPIServerURLs: []

# Agent runs on nodes matching nodeSelector, and (for the Constellation fork's
# sharded datapath) only MANAGES pawn nodes carrying managedPawnsSelector. Set
# managedPawnsSelector to "" for a stock single-datapath cluster (no sharding).
# kubernetes.io/arch is here (not just a deploy-time --set) so an arm64 node
# is excluded by construction, not by remembering to list it - the Cilium/BPF
# datapath doesn't run there today, so there's nothing "primary" enough to
# override this with.
nodeSelector:
  peri.apsis/primary: "true"
  kubernetes.io/arch: amd64
managedPawnsSelector: peri.apsis/host

# Optional cilium cluster identity (clustermesh). 0 / "" = unset.
clusterName: ""
clusterID: 0
# Overwrite the auto-detected MTU. 0 = auto.
mtu: 0

# Per-node tunnel-endpoint overrides: comma-separated nodename=ipv4 pairs. When
# THIS node has L2 reachability to the given IP (it falls in a locally-connected
# subnet), the agent uses that IP as the VXLAN tunnel endpoint for the named
# remote node instead of the node's advertised InternalIP. A per-node
# L2-reachability guard (isLocallyReachable) makes this safe to set cluster-wide:
# a node that can't reach the IP silently keeps the default endpoint. Pins a
# dual-homed pair onto their fast shared link, e.g. node-b->node-a over a
# direct ethernet address instead of the slower shared InternalIP.
#   tunnelEndpointOverrides: "node-a=10.1.0.1"
tunnelEndpointOverrides: ""

# Enable the BPF scale-to-zero datapath (SYN trap + flow tracking maps).
# When true, the agent compiles constellation_stz maps into the BPF programs
# so the periapsis agent can detect idle pods and trap wake SYNs.
enableScaleToZeroDatapath: false

# Fraction of host RAM the agent budgets for the dynamically-sized BPF maps
# (CT, NAT, neigh, sock-rev). Set explicitly rather than left to the agent's
# own 0.0025 default, so the figure is visible and proportionate on every host
# instead of being rediscovered per-overlay.
#
# The default matches the agent's own 0.0025 - stated here rather than
# inherited, so it is visible and reviewable. Raise it per-deployment (see
# examples/inventx-values.yaml) rather than by writing a literal into
# agent.extraArgs, which silently overrides this without changing what the
# chart says.
#
# It is a RATIO, so it self-scales and one value suits any host size. Do NOT
# copy a large value from a big machine onto a small one - inventx ran 0.15 on
# a 7.7 GiB node, which claimed 2.1 GiB (27% of the box) permanently and
# evicted pods for two days.
#
# The ratio is NOT a memory cap. It budgets an entry count, which is then split
# across map types and rounded up per possible-CPU for distributed LRU, so real
# memlock lands roughly 1.8x above ratio*RAM. Measure, do not assume.
#
# Too LOW is not free either: undersized CT/NAT tables drop established
# connections under load, which is far quieter than an eviction.
bpfMapDynamicSizeRatio: 0.0025

# cluster-pool IPAM (operator allocates per-node PodCIDRs from this pool).
clusterPool:
  cidr: 10.0.0.0/8
  maskSize: 20

agent:
  image:
    repository: ghcr.io/malformed-c/constellation-agent
    tag: main
    # Pin to a specific amd64 manifest digest (sha256:...) instead of
    # tracking tag above. Takes precedence over tag when set. Use this
    # for any deploy where a stuck/slow pull must not silently retry
    # against a newer digest that a moving tag started pointing to
    # mid-pull.
    digest: ""
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  tolerations:
    - operator: Exists
  # Extra cilium-agent flags, appended after the always-on base set
  # (--routing-mode=tunnel, --kube-proxy-replacement=true, --ipam=cluster-pool,
  # --enable-ipv6=false, --enable-bpf-masquerade=true, --bpf-lb-sock-hostns-only=true).
  extraArgs: []

operator:
  image:
    repository: ghcr.io/malformed-c/constellation-operator
    tag: main
    pullPolicy: Always
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
  # The operator reaches the API server via a kubeconfig on the host (it runs
  # hostNetwork on a node where in-cluster config isn't usable).
  #
  # Defaults to the standard kubeadm location. Any distribution that puts it
  # elsewhere must override BOTH values -- k3s uses /etc/rancher/k3s/k3s.yaml,
  # and the self-hosted perigeos control plane uses
  # /etc/kubernetes/constellation/kubeconfig (see examples/inventx-values.yaml).
  #
  # Getting this wrong is not a soft failure: the volume is declared
  # type=Directory, which Kubernetes requires to already exist, so the operator
  # pod cannot start at all. This default was k3s until 2026-09-03 and that
  # broke inventx, which is neither k3s nor kubeadm -- and a pinned chart
  # version did NOT protect them, because the OCI tag was re-published with the
  # changed default underneath it. Deployments should SET these, not inherit
  # them.
  kubeconfigDir: /etc/kubernetes
  kubeconfigPath: /etc/kubernetes/admin.conf
  # Scheduling. Default: no hard nodeSelector, prefer the control-plane via
  # affinity, tolerate everything. Override nodeSelector to pin it.
  nodeSelector: {}
  tolerations:
    - operator: Exists
  extraArgs: []
